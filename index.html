<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/assets/i/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Developer Portfolio | Justin B Hayes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }

      function loadAnalytics() {
        if (window.__gaLoaded) {
          return;
        }
        window.__gaLoaded = true;

        const script = document.createElement("script");
        script.async = true;
        script.src = "https://www.googletagmanager.com/gtag/js?id=G-5043BE890C";
        script.onload = function () {
          gtag("js", new Date());
          gtag("config", "G-5043BE890C");
        };
        document.head.appendChild(script);
      }

      function scheduleAnalyticsLoad() {
        const run = function () {
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(loadAnalytics, { timeout: 2000 });
            return;
          }

          setTimeout(loadAnalytics, 0);
        };

        const interactionEvents = [
          "pointerdown",
          "keydown",
          "scroll",
          "touchstart",
        ];

        const onFirstInteraction = function () {
          interactionEvents.forEach((eventName) => {
            window.removeEventListener(eventName, onFirstInteraction, {
              passive: true,
            });
          });
          run();
        };

        interactionEvents.forEach((eventName) => {
          window.addEventListener(eventName, onFirstInteraction, {
            once: true,
            passive: true,
          });
        });

        // Keep analytics for very long passive sessions without pulling it into
        // the initial critical path.
        setTimeout(run, 30000);
      }

      scheduleAnalyticsLoad();
    </script>
  </body>
</html>
